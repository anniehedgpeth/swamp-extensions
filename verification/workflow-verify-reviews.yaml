id: 94c0688e-1bf0-4f4b-b1b2-cb349e4abe36
name: verify-reviews
description: |
  Agent code reviews using claude CLI directly. Detects changed files,
  constructs review prompts with the diff inlined, and runs claude -p
  for each review type in parallel. Runs on the host in a fresh git
  worktree so CLAUDE.md, skills, and file reads reflect the verified commit.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
  required:
    - commit
    - branch

concurrency: 4

jobs:
  # ── Fresh Checkout ──────────────────────────────────────────
  - name: setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-setup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              git fetch origin main
              CHECKOUT_DIR="/tmp/swamp-verify-reviews-${{ run.id }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"

  # ── Detect Changed Files ──────────────────────────────────────
  - name: detect-changes
    description: Compute the merge-base diff and changed file list.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: diff
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo
          methodName: diff
          inputs:
            base: "origin/main"

      - name: changed-files
        dependsOn:
          - step: diff
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: repo
          methodName: diff
          inputs:
            base: "origin/main"
            nameOnly: true

  # ── Agent Reviews ────────────────────────────────────────────
  - name: reviews
    description: Run all agent reviews in parallel using claude CLI.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: code-review
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-code-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              trap 'rm -f "$DIFF_FILE" "$PROMPT_FILE" "$RESULT_FILE"' EXIT
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/code-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              if [ "$VERDICT" != "pass" ]; then
                echo "::error::Code review did not pass (verdict: ${VERDICT:-missing})"
                exit 1
              fi
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

      - name: adversarial-review
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-adversarial-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              trap 'rm -f "$DIFF_FILE" "$PROMPT_FILE" "$RESULT_FILE"' EXIT
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/adversarial-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              if [ "$VERDICT" != "pass" ]; then
                echo "::error::Adversarial review did not pass (verdict: ${VERDICT:-missing})"
                exit 1
              fi
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

      - name: ci-security-review
        guard: "${{ data.latest('repo', 'diff').attributes.files.filter(f, f.startsWith('.forgejo/') || f.startsWith('.github/') || f.startsWith('scripts/') || f.startsWith('verification/')).size() > 0 }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-ci-security-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -o pipefail
              MERGE_BASE=$(git merge-base origin/main HEAD)
              DIFF_FILE=$(mktemp)
              PROMPT_FILE=$(mktemp)
              RESULT_FILE=$(mktemp)
              trap 'rm -f "$DIFF_FILE" "$PROMPT_FILE" "$RESULT_FILE"' EXIT
              git diff "$MERGE_BASE" > "$DIFF_FILE"
              cat verification/review-prompts/ci-security-review.md > "$PROMPT_FILE"
              printf '\n\nThe diff to review is at: %s\nRead that file to see the changes.\n\nOutput your review. Start with a single line: VERDICT: pass or VERDICT: fail\nThen provide your full review.\n' "$DIFF_FILE" >> "$PROMPT_FILE"
              claude -p - \
                --model claude-opus-4-6 \
                --allowedTools "Read,Glob,Grep" < "$PROMPT_FILE" | tee "$RESULT_FILE"
              VERDICT=$(head -5 "$RESULT_FILE" | grep -o 'VERDICT: [a-z]*' | head -1 | cut -d' ' -f2)
              if [ "$VERDICT" != "pass" ]; then
                echo "::error::CI security review did not pass (verdict: ${VERDICT:-missing})"
                exit 1
              fi
            workingDir: "/tmp/swamp-verify-reviews-${{ run.id }}"

  # ── Cleanup ──────────────────────────────────────────────────
  - name: cleanup
    description: Remove the temporary worktree.
    dependsOn:
      - job: reviews
        condition:
          type: always
    steps:
      - name: remove-worktree
        task:
          type: model_method
          modelType: "command/shell"
          modelName: review-cleanup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              CHECKOUT_DIR="/tmp/swamp-verify-reviews-${{ run.id }}"
              git worktree remove --force "$CHECKOUT_DIR" 2>/dev/null || true
              git worktree prune
              # Remove ephemeral auto-definitions created for this run
              REPO_ROOT="$(git rev-parse --git-common-dir)/.."
              find "$REPO_ROOT/.swamp/auto-definitions" -name "*-${{ run.id }}.yaml" -delete 2>/dev/null || true
            ignoreExitCode: true
