id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
name: verify-build
description: |
  Build verification for swamp-extensions: per-directory quality gate
  (check, lint, fmt, test, lockfile), codegen idempotency check, and model
  version/upgrade gate. Runs on the host in a fresh git worktree checked out
  at the verified commit.
version: 1

tags:
  purpose: pre-pr-verification

inputs:
  properties:
    commit:
      type: string
      description: Commit SHA being verified.
    branch:
      type: string
      description: Branch name being verified.
  required:
    - commit
    - branch

concurrency: 8

jobs:
  # ── Fresh Checkout ──────────────────────────────────────────
  - name: setup
    description: Create a clean worktree at the verified commit.
    steps:
      - name: checkout
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-setup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              git fetch origin main
              CHECKOUT_DIR="/tmp/swamp-verify-build-${{ run.id }}"
              rm -rf "$CHECKOUT_DIR"
              git worktree prune
              git worktree add --detach "$CHECKOUT_DIR" "${{ inputs.commit }}"

  # ── Detect Changed Directories ──────────────────────────────
  - name: detect-changes
    description: Determine which extension directories have changes.
    dependsOn:
      - job: setup
        condition:
          type: succeeded
    steps:
      - name: changed-dirs
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-detect-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              MERGE_BASE=$(git merge-base origin/main HEAD)
              CHANGED=$(git diff --name-only "$MERGE_BASE")

              # Extension directories with their own deno.json
              EXTENSION_DIRS="agent-runner deno-runner issue-lifecycle ssh kubernetes workflows cve software-factory container-image git"
              VAULT_DIRS=$(find vault -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort)
              DATASTORE_DIRS=$(find datastore -maxdepth 1 -mindepth 1 -type d 2>/dev/null | grep -v benchmarks | sort)

              echo "=== Changed extension directories ==="
              for dir in $EXTENSION_DIRS; do
                if echo "$CHANGED" | grep -q "^${dir}/"; then
                  echo "CHANGED_DIR: $dir"
                fi
              done

              for dir in $VAULT_DIRS; do
                if echo "$CHANGED" | grep -q "^${dir}/"; then
                  echo "CHANGED_DIR: $dir"
                fi
              done

              for dir in $DATASTORE_DIRS; do
                if echo "$CHANGED" | grep -q "^${dir}/"; then
                  echo "CHANGED_DIR: $dir"
                fi
              done

              # Codegen directory
              if echo "$CHANGED" | grep -q "^codegen/"; then
                echo "CHANGED_CODEGEN: true"
              fi

              # Model directories (for version/upgrade check)
              echo "=== Changed model directories ==="
              echo "$CHANGED" | grep "^model/" | cut -d/ -f1-3 | sort -u | while read -r mdir; do
                if [ -f "$mdir/manifest.yaml" ]; then
                  echo "CHANGED_MODEL: $mdir"
                fi
              done

              echo "=== Detection complete ==="
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Per-Directory Build Checks ──────────────────────────────
  - name: extension-checks
    description: Run quality gate for each changed extension directory.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: check-extensions
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-extensions-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              MERGE_BASE=$(git merge-base origin/main HEAD)
              CHANGED=$(git diff --name-only "$MERGE_BASE")
              FAILED=""

              run_quality_gate() {
                local dir="$1"
                local type="$2"
                echo "::group::Quality gate: $dir"

                if [ ! -f "$dir/deno.json" ]; then
                  echo "Skipping $dir (no deno.json)"
                  echo "::endgroup::"
                  return 0
                fi

                cd "$dir"

                # Determine the extension type path
                local ext_path="extensions/${type}/"
                if [ ! -d "$ext_path" ]; then
                  # Try common alternatives
                  for candidate in extensions/models/ extensions/vaults/ extensions/datastores/ extensions/workflows/; do
                    if [ -d "$candidate" ]; then
                      ext_path="$candidate"
                      break
                    fi
                  done
                fi

                local failed_step=""

                echo "--- deno check ---"
                if ! deno check ${ext_path}*.ts 2>&1; then
                  failed_step="check"
                fi

                echo "--- deno lint ---"
                if ! deno lint ${ext_path} 2>&1; then
                  failed_step="${failed_step:+$failed_step, }lint"
                fi

                echo "--- deno fmt --check ---"
                if ! deno fmt --check ${ext_path} 2>&1; then
                  failed_step="${failed_step:+$failed_step, }fmt"
                fi

                echo "--- deno test ---"
                if ! deno test --allow-env --allow-net --allow-sys --allow-read --allow-write --allow-run ${ext_path} 2>&1; then
                  failed_step="${failed_step:+$failed_step, }test"
                fi

                echo "--- deno install --frozen ---"
                if ! deno install --frozen 2>&1; then
                  failed_step="${failed_step:+$failed_step, }lockfile"
                fi

                cd - > /dev/null
                echo "::endgroup::"

                if [ -n "$failed_step" ]; then
                  echo "::error::$dir failed: $failed_step"
                  return 1
                fi
                return 0
              }

              # Extension directories
              EXTENSION_DIRS="agent-runner deno-runner issue-lifecycle ssh kubernetes workflows cve software-factory container-image git"
              for dir in $EXTENSION_DIRS; do
                if echo "$CHANGED" | grep -q "^${dir}/"; then
                  if ! run_quality_gate "$dir" "models"; then
                    FAILED="${FAILED:+$FAILED, }$dir"
                  fi
                fi
              done

              # Vault directories
              for dir in $(find vault -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort); do
                if echo "$CHANGED" | grep -q "^${dir}/"; then
                  if ! run_quality_gate "$dir" "vaults"; then
                    FAILED="${FAILED:+$FAILED, }$dir"
                  fi
                fi
              done

              # Datastore directories
              for dir in $(find datastore -maxdepth 1 -mindepth 1 -type d 2>/dev/null | grep -v benchmarks | sort); do
                if echo "$CHANGED" | grep -q "^${dir}/"; then
                  if ! run_quality_gate "$dir" "datastores"; then
                    FAILED="${FAILED:+$FAILED, }$dir"
                  fi
                fi
              done

              if [ -n "$FAILED" ]; then
                echo "::error::Build checks failed for: $FAILED"
                exit 1
              fi

              echo "All extension checks passed"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Model Directory Checks ─────────────────────────────────
  - name: model-checks
    description: Run check and lockfile verification for changed model directories.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: check-models
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-models-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              MERGE_BASE=$(git merge-base origin/main HEAD)
              CHANGED=$(git diff --name-only "$MERGE_BASE")
              FAILED=""

              # Find changed model directories
              MODEL_DIRS=$(echo "$CHANGED" | grep "^model/" | while read -r f; do
                # For aws/gcp: model/<provider>/<service>
                # For hetzner/digitalocean: model/<provider>
                dir=$(echo "$f" | cut -d/ -f1-2)
                if [ -f "$dir/deno.json" ]; then
                  echo "$dir"
                else
                  dir=$(echo "$f" | cut -d/ -f1-3)
                  if [ -f "$dir/deno.json" ]; then
                    echo "$dir"
                  fi
                fi
              done | sort -u)

              if [ -z "$MODEL_DIRS" ]; then
                echo "No model directories changed"
                exit 0
              fi

              for dir in $MODEL_DIRS; do
                echo "::group::Model check: $dir"
                cd "$dir"

                echo "--- deno check ---"
                if ! deno check extensions/models/*.ts 2>&1; then
                  FAILED="${FAILED:+$FAILED, }$dir(check)"
                fi

                echo "--- deno lint --no-config ---"
                if ! deno lint --no-config extensions/models/ 2>&1; then
                  FAILED="${FAILED:+$FAILED, }$dir(lint)"
                fi

                echo "--- deno fmt --no-config --check ---"
                if ! deno fmt --no-config --check extensions/models/ 2>&1; then
                  FAILED="${FAILED:+$FAILED, }$dir(fmt)"
                fi

                echo "--- deno install --frozen ---"
                if ! deno install --frozen 2>&1; then
                  FAILED="${FAILED:+$FAILED, }$dir(lockfile)"
                fi

                cd - > /dev/null
                echo "::endgroup::"
              done

              if [ -n "$FAILED" ]; then
                echo "::error::Model checks failed: $FAILED"
                exit 1
              fi

              echo "All model checks passed"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Codegen Idempotency ─────────────────────────────────────
  - name: codegen-verify
    description: Verify codegen is idempotent (second run produces zero diff).
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: codegen-check
        guard: "${{ data.latest('build-detect-' + run.id, 'log').attributes.stdout.contains('CHANGED_CODEGEN: true') }}"
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-codegen-check-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              cd codegen

              echo "--- deno check ---"
              deno check main.ts

              echo "--- deno lint ---"
              deno lint

              echo "--- deno fmt --check ---"
              deno fmt --check

              echo "--- deno install --frozen ---"
              deno install --frozen
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: idempotency
        guard: "${{ data.latest('build-detect-' + run.id, 'log').attributes.stdout.contains('CHANGED_CODEGEN: true') }}"
        dependsOn:
          - step: codegen-check
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-codegen-idem-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              cd codegen

              echo "=== First generation (Hetzner + DigitalOcean) ==="
              deno task generate:hetzner
              deno task generate:digitalocean

              echo "=== Checking for diffs after first generation ==="
              FIRST_DIFF=$(git diff --name-only)
              if [ -n "$FIRST_DIFF" ]; then
                echo "First generation produced expected diffs:"
                echo "$FIRST_DIFF"
              fi

              echo "=== Second generation (idempotency canary) ==="
              deno task generate:hetzner
              deno task generate:digitalocean

              echo "=== Checking for NEW diffs after second generation ==="
              SECOND_DIFF=$(git diff --name-only)
              if [ "$FIRST_DIFF" != "$SECOND_DIFF" ]; then
                echo "::error::Second generation produced new diffs — codegen is not idempotent"
                git diff --stat
                exit 1
              fi

              echo "Codegen idempotency verified"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Model Version/Upgrade Gate ──────────────────────────────
  - name: upgrade-verify
    description: Verify model version changes have matching upgrade entries.
    dependsOn:
      - job: detect-changes
        condition:
          type: succeeded
    steps:
      - name: check-upgrades
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-upgrade-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              MERGE_BASE=$(git merge-base origin/main HEAD)
              FAILED=""

              # Find model directories with version changes in manifest.yaml
              MANIFESTS=$(git diff "$MERGE_BASE" --name-only | grep "manifest.yaml" | grep "^model/" || true)

              if [ -z "$MANIFESTS" ]; then
                echo "No model manifest changes detected"
                exit 0
              fi

              for manifest in $MANIFESTS; do
                dir=$(dirname "$manifest")

                # Skip if this is a brand-new extension (no version in base)
                OLD_VERSION=$(git show "$MERGE_BASE:$manifest" 2>/dev/null | grep "^version:" | head -1 | awk '{print $2}' || true)
                NEW_VERSION=$(grep "^version:" "$manifest" | head -1 | awk '{print $2}')

                if [ -z "$OLD_VERSION" ]; then
                  echo "Skipping $dir — new extension (no published version)"
                  continue
                fi

                if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
                  echo "Skipping $dir — version unchanged ($NEW_VERSION)"
                  continue
                fi

                echo "::group::Upgrade check: $dir ($OLD_VERSION -> $NEW_VERSION)"

                # Check that the model file has an upgrades entry with toVersion matching new version
                MODEL_FILES=$(find "$dir/extensions/models/" -name "*.ts" ! -name "*_test.ts" ! -name "*_lib*" 2>/dev/null | head -5)
                FOUND_UPGRADE=false

                for model_file in $MODEL_FILES; do
                  if grep -q "toVersion.*${NEW_VERSION}" "$model_file" 2>/dev/null; then
                    FOUND_UPGRADE=true
                    echo "Found upgrade entry in $model_file"
                    break
                  fi
                done

                if [ "$FOUND_UPGRADE" = "false" ]; then
                  echo "::error::$dir: version bumped to $NEW_VERSION but no upgrade entry with toVersion: $NEW_VERSION found"
                  FAILED="${FAILED:+$FAILED, }$dir"
                fi

                echo "::endgroup::"
              done

              if [ -n "$FAILED" ]; then
                echo "::error::Upgrade entry check failed for: $FAILED"
                exit 1
              fi

              echo "All upgrade entries verified"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

      - name: upgrade-path-test
        dependsOn:
          - step: check-upgrades
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-upgrade-path-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              set -e
              MERGE_BASE=$(git merge-base origin/main HEAD)
              CHECKOUT_DIR="/tmp/swamp-verify-build-${{ run.id }}"
              FAILED=""

              # Find model directories with version changes
              MANIFESTS=$(git diff "$MERGE_BASE" --name-only | grep "manifest.yaml" | grep "^model/" || true)

              if [ -z "$MANIFESTS" ]; then
                echo "No model manifest changes — skipping upgrade path test"
                exit 0
              fi

              for manifest in $MANIFESTS; do
                dir=$(dirname "$manifest")

                OLD_VERSION=$(git show "$MERGE_BASE:$manifest" 2>/dev/null | grep "^version:" | head -1 | awk '{print $2}' || true)
                NEW_VERSION=$(grep "^version:" "$manifest" | head -1 | awk '{print $2}')

                # Skip new extensions or unchanged versions
                if [ -z "$OLD_VERSION" ] || [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
                  continue
                fi

                # Skip vault/datastore extensions (they don't use the upgrade system)
                if echo "$dir" | grep -qE "^(vault|datastore)/"; then
                  echo "Skipping $dir — vault/datastore extensions don't participate in upgrades"
                  continue
                fi

                # Extract extension name from manifest
                EXT_NAME=$(grep "^name:" "$manifest" | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")
                if [ -z "$EXT_NAME" ]; then
                  echo "Warning: could not extract extension name from $manifest"
                  continue
                fi

                # Extract a model type from the manifest
                MODEL_TYPE=$(grep "^\s*type:" "$dir/extensions/models/"*.ts 2>/dev/null | grep -v "import\|z\.\|Schema\|schema" | grep -o '"[^"]*"' | head -1 | tr -d '"' || true)
                if [ -z "$MODEL_TYPE" ]; then
                  echo "Warning: could not extract model type from $dir"
                  continue
                fi

                echo "::group::Upgrade path test: $EXT_NAME ($OLD_VERSION -> $NEW_VERSION)"

                UPGRADE_DIR="/tmp/swamp-upgrade-test-${{ run.id }}-$(echo $dir | tr / -)"
                rm -rf "$UPGRADE_DIR"

                # Run the 7-step upgrade path verification
                if swamp init "$UPGRADE_DIR" --tool none --force 2>&1 && \
                   cd "$UPGRADE_DIR" && \
                   swamp extension pull "$EXT_NAME" 2>&1 && \
                   swamp model create "$EXT_NAME/$MODEL_TYPE" upgrade-test 2>&1 && \
                   swamp extension rm "$EXT_NAME" --force 2>&1 && \
                   swamp extension source add "$CHECKOUT_DIR/$dir" --only models 2>&1; then

                  # Run a method — the upgrade validation happens before the method body
                  # The method may fail for unrelated reasons (no credentials etc.) — that's OK
                  # We only care about whether the upgrade validation itself passes
                  METHOD=$(grep "methodName:" "$CHECKOUT_DIR/$dir/extensions/models/"*.ts 2>/dev/null | head -1 | grep -o '"[^"]*"' | tr -d '"' || echo "get")
                  swamp model method run upgrade-test "$METHOD" 2>&1 || true

                  # Check that typeVersion stepped to new version
                  ACTUAL_VERSION=$(swamp model get upgrade-test --json 2>/dev/null | grep -o '"typeVersion":"[^"]*"' | cut -d'"' -f4 || true)
                  if [ "$ACTUAL_VERSION" != "$NEW_VERSION" ]; then
                    echo "::error::Upgrade path failed: typeVersion is $ACTUAL_VERSION, expected $NEW_VERSION"
                    FAILED="${FAILED:+$FAILED, }$dir"
                  else
                    echo "Upgrade path verified: typeVersion stepped to $NEW_VERSION"
                  fi
                else
                  echo "::error::Upgrade path setup failed for $dir"
                  FAILED="${FAILED:+$FAILED, }$dir"
                fi

                # Cleanup
                rm -rf "$UPGRADE_DIR"
                cd "$CHECKOUT_DIR"

                echo "::endgroup::"
              done

              if [ -n "$FAILED" ]; then
                echo "::error::Upgrade path verification failed for: $FAILED"
                exit 1
              fi

              echo "All upgrade paths verified"
            workingDir: "/tmp/swamp-verify-build-${{ run.id }}"

  # ── Cleanup ─────────────────────────────────────────────────
  - name: cleanup
    description: Remove the temporary worktree.
    dependsOn:
      - job: extension-checks
        condition:
          type: always
      - job: model-checks
        condition:
          type: always
      - job: codegen-verify
        condition:
          type: always
      - job: upgrade-verify
        condition:
          type: always
    steps:
      - name: remove-worktree
        task:
          type: model_method
          modelType: "command/shell"
          modelName: build-cleanup-${{ run.id }}
          methodName: execute
          inputs:
            run: |
              CHECKOUT_DIR="/tmp/swamp-verify-build-${{ run.id }}"
              git worktree remove --force "$CHECKOUT_DIR" 2>/dev/null || true
              git worktree prune
              # Remove ephemeral auto-definitions created for this run
              REPO_ROOT="$(git rev-parse --git-common-dir)/.."
              find "$REPO_ROOT/.swamp/auto-definitions" -name "*-${{ run.id }}.yaml" -delete 2>/dev/null || true
              # Remove upgrade test directories
              rm -rf /tmp/swamp-upgrade-test-${{ run.id }}-* 2>/dev/null || true
            ignoreExitCode: true
