name: "CI: Reviews"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.filter.outputs.has_source }}
      has_ci: ${{ steps.filter.outputs.has_ci }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          # Source changes that warrant a code review (excludes model/ which is auto-generated)
          if echo "$CHANGED" | grep -qE "^(vault/|datastore/|codegen/|issue-lifecycle/|ssh/|kubernetes/|workflows/|cve/|software-factory/|container-image/)"; then
            echo "has_source=true" >> $GITHUB_OUTPUT
          else
            echo "has_source=false" >> $GITHUB_OUTPUT
          fi

          # CI/workflow file changes
          if echo "$CHANGED" | grep -qE "^\.(forgejo|github)/|^scripts/"; then
            echo "has_ci=true" >> $GITHUB_OUTPUT
          else
            echo "has_ci=false" >> $GITHUB_OUTPUT
          fi

  claude-review:
    name: Claude Code Review
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: |
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.has_source == 'true' || needs.changes.outputs.has_ci == 'true')
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/review"
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > ${RUNNER_TEMP}/review/changed-files.txt || true
          COUNT=$(wc -l < ${RUNNER_TEMP}/review/changed-files.txt | tr -d ' ')
          echo "Changed files in scope: $COUNT"
          cat ${RUNNER_TEMP}/review/changed-files.txt
          if [ "$COUNT" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude Code Review
        if: steps.changed.outputs.has_files == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CLAUDE_VERSION="2.1.150"
          CLAUDE_CHECKSUM="6c086a0f5fbf684d4148bb69629268b4f5109498c1a7be757acf18c51fd04f4b"
          curl -fsSL -o ${RUNNER_TEMP}/review/claude "https://downloads.claude.ai/claude-code-releases/${CLAUDE_VERSION}/linux-x64/claude"
          echo "${CLAUDE_CHECKSUM}  ${RUNNER_TEMP}/review/claude" | sha256sum -c -
          chmod +x ${RUNNER_TEMP}/review/claude

          OUTPUT_DIR="${GITHUB_WORKSPACE}/.review-output"
          mkdir -p "$OUTPUT_DIR"

          CHANGED_COUNT=$(wc -l < ${RUNNER_TEMP}/review/changed-files.txt | tr -d ' ')
          if [ "$CHANGED_COUNT" -gt 500 ]; then
            grep -v '^model/' ${RUNNER_TEMP}/review/changed-files.txt > ${RUNNER_TEMP}/review/source-files.txt || true
            MODEL_COUNT=$(grep -c '^model/' ${RUNNER_TEMP}/review/changed-files.txt || echo 0)
            SOURCE_FILES=$(cat ${RUNNER_TEMP}/review/source-files.txt)
            CHANGED_FILES="${SOURCE_FILES}

          [Plus ${MODEL_COUNT} auto-generated files under model/ — these are codegen output. Review the codegen source files above; use git diff to spot-check generated output if needed.]"
          else
            CHANGED_FILES=$(cat ${RUNNER_TEMP}/review/changed-files.txt)
          fi

          PROMPT="$(cat .forgejo/prompts/review.md)

          OUTPUT_DIR: ${OUTPUT_DIR}

          CHANGED FILES (this is the complete list — do NOT review any other files):
          ${CHANGED_FILES}"

          ${RUNNER_TEMP}/review/claude -p "$PROMPT" \
            --model claude-sonnet-4-6 \
            --add-dir "$OUTPUT_DIR" \
            --disallowedTools "Write" "Edit" \
            --allowedTools "Read,Grep,Bash(git diff:*),Bash(git log:*),Bash(tee ${OUTPUT_DIR}/review-body.md:*),Bash(touch ${OUTPUT_DIR}/review-failed)"

      - name: Post review comment
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/.review-output"
          if [ -f "${OUTPUT_DIR}/review-body.md" ]; then
            python3 -c "import json; print(json.dumps({'body': open('${OUTPUT_DIR}/review-body.md').read()}))" > ${RUNNER_TEMP}/review/payload.json
            HTTP_CODE=$(curl -s -o ${RUNNER_TEMP}/review/curl-response.txt -w "%{http_code}" -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d @${RUNNER_TEMP}/review/payload.json \
              "https://git.swamp-club.com/api/v1/repos/$REPO/issues/$PR_NUMBER/comments")
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Failed to post review comment (HTTP $HTTP_CODE)"
              cat ${RUNNER_TEMP}/review/curl-response.txt
              exit 1
            fi
            echo "Review comment posted (HTTP $HTTP_CODE)"
          else
            echo "::warning::No review body found at ${OUTPUT_DIR}/review-body.md"
          fi

      - name: Fail if changes requested
        run: |
          if [ -f "${GITHUB_WORKSPACE}/.review-output/review-failed" ]; then
            echo "::error::Code review requested changes — blocking merge"
            exit 1
          fi

  claude-adversarial-review:
    name: Adversarial Code Review
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: |
      github.event.pull_request.draft == false &&
      needs.changes.outputs.has_source == 'true'
    concurrency:
      group: claude-adversarial-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/review"
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > ${RUNNER_TEMP}/review/changed-files.txt || true
          COUNT=$(wc -l < ${RUNNER_TEMP}/review/changed-files.txt | tr -d ' ')
          echo "Changed files in scope: $COUNT"
          cat ${RUNNER_TEMP}/review/changed-files.txt
          if [ "$COUNT" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Adversarial Code Review
        if: steps.changed.outputs.has_files == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CLAUDE_VERSION="2.1.150"
          CLAUDE_CHECKSUM="6c086a0f5fbf684d4148bb69629268b4f5109498c1a7be757acf18c51fd04f4b"
          curl -fsSL -o ${RUNNER_TEMP}/review/claude "https://downloads.claude.ai/claude-code-releases/${CLAUDE_VERSION}/linux-x64/claude"
          echo "${CLAUDE_CHECKSUM}  ${RUNNER_TEMP}/review/claude" | sha256sum -c -
          chmod +x ${RUNNER_TEMP}/review/claude

          OUTPUT_DIR="${GITHUB_WORKSPACE}/.review-output"
          mkdir -p "$OUTPUT_DIR"

          CHANGED_COUNT=$(wc -l < ${RUNNER_TEMP}/review/changed-files.txt | tr -d ' ')
          if [ "$CHANGED_COUNT" -gt 500 ]; then
            grep -v '^model/' ${RUNNER_TEMP}/review/changed-files.txt > ${RUNNER_TEMP}/review/source-files.txt || true
            MODEL_COUNT=$(grep -c '^model/' ${RUNNER_TEMP}/review/changed-files.txt || echo 0)
            SOURCE_FILES=$(cat ${RUNNER_TEMP}/review/source-files.txt)
            CHANGED_FILES="${SOURCE_FILES}

          [Plus ${MODEL_COUNT} auto-generated files under model/ — these are codegen output. Review the codegen source files above; use git diff to spot-check generated output if needed.]"
          else
            CHANGED_FILES=$(cat ${RUNNER_TEMP}/review/changed-files.txt)
          fi

          PROMPT="$(cat .forgejo/prompts/adversarial.md)

          OUTPUT_DIR: ${OUTPUT_DIR}

          CHANGED FILES (this is the complete list — do NOT review any other files):
          ${CHANGED_FILES}"

          ${RUNNER_TEMP}/review/claude -p "$PROMPT" \
            --model claude-opus-4-6 \
            --add-dir "$OUTPUT_DIR" \
            --disallowedTools "Write" "Edit" \
            --allowedTools "Read,Grep,Bash(git diff:*),Bash(git log:*),Bash(tee ${OUTPUT_DIR}/review-body.md:*),Bash(touch ${OUTPUT_DIR}/review-failed)"

      - name: Post review comment
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          OUTPUT_DIR="${GITHUB_WORKSPACE}/.review-output"
          if [ -f "${OUTPUT_DIR}/review-body.md" ]; then
            python3 -c "import json; print(json.dumps({'body': open('${OUTPUT_DIR}/review-body.md').read()}))" > ${RUNNER_TEMP}/review/payload.json
            HTTP_CODE=$(curl -s -o ${RUNNER_TEMP}/review/curl-response.txt -w "%{http_code}" -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d @${RUNNER_TEMP}/review/payload.json \
              "https://git.swamp-club.com/api/v1/repos/$REPO/issues/$PR_NUMBER/comments")
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Failed to post review comment (HTTP $HTTP_CODE)"
              cat ${RUNNER_TEMP}/review/curl-response.txt
              exit 1
            fi
            echo "Review comment posted (HTTP $HTTP_CODE)"
          else
            echo "::warning::No review body found at ${OUTPUT_DIR}/review-body.md"
          fi

      - name: Fail if changes requested
        run: |
          if [ -f "${GITHUB_WORKSPACE}/.review-output/review-failed" ]; then
            echo "::error::Adversarial review requested changes — blocking merge"
            exit 1
          fi

  claude-ci-security-review:
    name: CI Security Review
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: |
      github.event.pull_request.draft == false &&
      needs.changes.outputs.has_ci == 'true'
    concurrency:
      group: claude-ci-security-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/review"
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -E '^\.(forgejo|github)/|^scripts/' > ${RUNNER_TEMP}/review/changed-files.txt || true
          COUNT=$(wc -l < ${RUNNER_TEMP}/review/changed-files.txt | tr -d ' ')
          echo "Changed workflow/CI files in scope: $COUNT"
          cat ${RUNNER_TEMP}/review/changed-files.txt
          if [ "$COUNT" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: CI Security Review
        if: steps.changed.outputs.has_files == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CLAUDE_VERSION="2.1.150"
          CLAUDE_CHECKSUM="6c086a0f5fbf684d4148bb69629268b4f5109498c1a7be757acf18c51fd04f4b"
          curl -fsSL -o ${RUNNER_TEMP}/review/claude "https://downloads.claude.ai/claude-code-releases/${CLAUDE_VERSION}/linux-x64/claude"
          echo "${CLAUDE_CHECKSUM}  ${RUNNER_TEMP}/review/claude" | sha256sum -c -
          chmod +x ${RUNNER_TEMP}/review/claude

          OUTPUT_DIR="${GITHUB_WORKSPACE}/.review-output"
          mkdir -p "$OUTPUT_DIR"

          CHANGED_COUNT=$(wc -l < ${RUNNER_TEMP}/review/changed-files.txt | tr -d ' ')
          if [ "$CHANGED_COUNT" -gt 500 ]; then
            grep -v '^model/' ${RUNNER_TEMP}/review/changed-files.txt > ${RUNNER_TEMP}/review/source-files.txt || true
