name: CI

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deps-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Scan for known vulnerabilities
        run: deno run --allow-read --allow-net=api.osv.dev --allow-env=GITHUB_STEP_SUMMARY --allow-write scripts/audit_deps.ts
      - name: Check for outdated dependencies
        run: |
          has_outdated=false
          for lockdir in $(find vault datastore model codegen issue-lifecycle kubernetes workflows cve ssh software-factory container-image -name "deno.lock" -exec dirname {} \;); do
            output=$(cd "$lockdir" && deno outdated 2>&1) || true
            if [ -n "$output" ]; then
              echo "::warning::Outdated dependencies in $lockdir"
              echo "$output"
              has_outdated=true
            fi
          done
          if [ "$has_outdated" = false ]; then
            echo "All dependencies are up to date"
          fi

  actions-audit:
    name: Actions Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Check for unpinned or outdated Actions
        run: deno run --allow-read --allow-net=api.github.com --allow-env=GITHUB_STEP_SUMMARY,GITHUB_TOKEN --allow-write scripts/audit_actions.ts

  gate:
    name: "Gate: Audit"
    if: always()
    needs: [deps-audit, actions-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::Audit checks failed"
            exit 1
          fi
