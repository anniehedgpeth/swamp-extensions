name: "CI: Vaults"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "vault/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vault-check:
    name: vault/${{ matrix.vault }} - ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vault: [1password, aws-sm, azure-kv]
        task: [check, lint, fmt, test]
    defaults:
      run:
        working-directory: vault/${{ matrix.vault }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: deno ${{ matrix.task }}
        run: |
          if [ "${{ matrix.task }}" = "fmt" ]; then
            deno fmt --check extensions/vaults/
          elif [ "${{ matrix.task }}" = "lint" ]; then
            deno lint extensions/vaults/
          elif [ "${{ matrix.task }}" = "test" ]; then
            deno test --allow-env --allow-net --allow-sys --allow-read --allow-write extensions/vaults/
          else
            deno check extensions/vaults/*.ts
          fi

  vault-lockfile:
    name: vault/${{ matrix.vault }} - lockfile up to date
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vault: [1password, aws-sm, azure-kv]
    defaults:
      run:
        working-directory: vault/${{ matrix.vault }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Verify lockfile is up to date
        run: deno install --frozen

  gate:
    name: "Gate: Vaults"
    if: always()
    needs: [vault-check, vault-lockfile]
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::Vault checks failed"
            exit 1
          fi
