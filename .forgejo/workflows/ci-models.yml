name: "CI: Models"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "model/**"
      - "codegen/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  model-check:
    name: model/${{ matrix.model }} - check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [hetzner-cloud, digitalocean]
    defaults:
      run:
        working-directory: model/${{ matrix.model }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: deno check
        run: deno check extensions/models/*.ts

  model-lockfile:
    name: model/${{ matrix.model }} - lockfile up to date
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [hetzner-cloud, digitalocean]
    defaults:
      run:
        working-directory: model/${{ matrix.model }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Verify lockfile is up to date
        run: deno install --frozen

  aws-check:
    name: aws models - sample check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: deno check (sample)
        run: |
          for service in healthimaging quicksight sns apigateway ec2; do
            echo "::group::model/aws/$service"
            (cd "model/aws/$service" && deno check extensions/models/*.ts)
            echo "::endgroup::"
          done

  aws-lockfile:
    name: aws models - lockfiles up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Verify all AWS lockfiles are up to date
        run: |
          failed=false
          for service in model/aws/*/; do
            if ! (cd "$service" && deno install --frozen 2>&1); then
              echo "::error::Lockfile out of date in $service"
              failed=true
            fi
          done
          if [ "$failed" = true ]; then
            exit 1
          fi

  gcp-check:
    name: gcp models - sample check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: deno check (sample)
        run: |
          for service in groupssettings container storage dataproc compute; do
            echo "::group::model/gcp/$service"
            (cd "model/gcp/$service" && deno check extensions/models/*.ts)
            echo "::endgroup::"
          done

  gcp-lockfile:
    name: gcp models - lockfiles up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Verify all GCP lockfiles are up to date
        run: |
          failed=false
          for service in model/gcp/*/; do
            if ! (cd "$service" && deno install --frozen 2>&1); then
              echo "::error::Lockfile out of date in $service"
              failed=true
            fi
          done
          if [ "$failed" = true ]; then
            exit 1
          fi

  cloudflare-check:
    name: cloudflare models - sample check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: deno check (sample)
        run: |
          for service in r2 load-balancing pages; do
            echo "::group::model/cloudflare/$service"
            (cd "model/cloudflare/$service" && deno check extensions/models/*.ts)
            echo "::endgroup::"
          done

  cloudflare-lockfile:
    name: cloudflare models - lockfiles up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Verify all Cloudflare lockfiles are up to date
        run: |
          failed=false
          for service in model/cloudflare/*/; do
            if ! (cd "$service" && deno install --frozen 2>&1); then
              echo "::error::Lockfile out of date in $service"
              failed=true
            fi
          done
          if [ "$failed" = true ]; then
            exit 1
          fi

  vercel-check:
    name: vercel models - sample check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: deno check (sample)
        run: |
          for service in projects deployments domains dns edge-config; do
            echo "::group::model/vercel/$service"
            (cd "model/vercel/$service" && deno check extensions/models/*.ts)
            echo "::endgroup::"
          done

  vercel-lockfile:
    name: vercel models - lockfiles up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Verify all Vercel lockfiles are up to date
        run: |
          failed=false
          for service in model/vercel/*/; do
            if ! (cd "$service" && deno install --frozen 2>&1); then
              echo "::error::Lockfile out of date in $service"
              failed=true
            fi
          done
          if [ "$failed" = true ]; then
            exit 1
          fi

  codegen-check:
    name: codegen - ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [check, lint, fmt]
    defaults:
      run:
        working-directory: codegen
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: deno ${{ matrix.task }}
        run: |
          if [ "${{ matrix.task }}" = "fmt" ]; then
            deno fmt --check
          elif [ "${{ matrix.task }}" = "lint" ]; then
            deno lint
          else
            deno check main.ts
          fi

  codegen-lockfile:
    name: codegen - lockfile up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codegen
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Verify lockfile is up to date
        run: deno install --frozen

  gate:
    name: "Gate: Models"
    if: always()
    needs:
      [
        model-check,
        model-lockfile,
        aws-check,
        aws-lockfile,
        gcp-check,
        gcp-lockfile,
        cloudflare-check,
        cloudflare-lockfile,
        vercel-check,
        vercel-lockfile,
        codegen-check,
        codegen-lockfile,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::Model checks failed"
            exit 1
          fi
