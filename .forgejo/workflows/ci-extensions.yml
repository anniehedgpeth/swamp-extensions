  gate:
    name: "Gate: Extensions"
    if: always()
    needs:
      [
        agent-runner-check,
        agent-runner-lockfile,
        issue-lifecycle-check,
        issue-lifecycle-lockfile,
        ssh-check,
        ssh-lockfile,
        kubernetes-check,
        kubernetes-lockfile,
        workflows-check,
        workflows-lockfile,
        cve-check,
        cve-lockfile,
        software-factory-check,
        software-factory-lockfile,
        container-image-check,
        container-image-lockfile,
        git-check,
        git-lockfile,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::Extension checks failed"
            exit 1
          fi
