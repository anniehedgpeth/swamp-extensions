name: "CI: Extensions"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "agent-runner/**"
      - "issue-lifecycle/**"
      - "ssh/**"
      - "kubernetes/**"
      - "workflows/**"
      - "cve/**"
      - "software-factory/**"
      - "container-image/**"
      - "git/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      agent-runner: ${{ steps.filter.outputs.agent-runner }}
      issue-lifecycle: ${{ steps.filter.outputs.issue-lifecycle }}
      ssh: ${{ steps.filter.outputs.ssh }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      workflows: ${{ steps.filter.outputs.workflows }}
      cve: ${{ steps.filter.outputs.cve }}
      software-factory: ${{ steps.filter.outputs.software-factory }}
      container-image: ${{ steps.filter.outputs.container-image }}
      git: ${{ steps.filter.outputs.git }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          check_path() {
            local name=$1; shift; local found=false
            for pattern in "$@"; do
              if echo "$CHANGED" | grep -q "^${pattern}"; then found=true; break; fi
            done
            echo "${name}=${found}" >> $GITHUB_OUTPUT
          }
          check_path agent-runner "agent-runner/"
          check_path issue-lifecycle "issue-lifecycle/"
          check_path ssh "ssh/"
          check_path kubernetes "kubernetes/"
          check_path workflows "workflows/"
          check_path cve "cve/"
          check_path software-factory "software-factory/"
          check_path container-image "container-image/"
          check_path git "git/"

  agent-runner-check:
    name: agent-runner - ${{ matrix.task }}
    needs: [changes]
    if: needs.changes.outputs.agent-runner == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [check, lint, fmt, test]
    defaults:
      run:
        working-directory: agent-runner
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: deno ${{ matrix.task }}
        run: |
          if [ "${{ matrix.task }}" = "fmt" ]; then
            deno fmt --check extensions/models/
          elif [ "${{ matrix.task }}" = "lint" ]; then
            deno lint extensions/models/
          elif [ "${{ matrix.task }}" = "test" ]; then
            deno test --allow-read --allow-write --allow-env --allow-run --allow-sys --allow-net extensions/models/
          else
            deno check extensions/models/agent_runner.ts
          fi

  agent-runner-lockfile:
    name: agent-runner - lockfile up to date
    needs: [changes]
    if: needs.changes.outputs.agent-runner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runner
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.x
      - name: Verify lockfile is up to date
        run: deno install --frozen

  issue-lifecycle-check:
    name: issue-lifecycle - ${{ matrix.task }}
    needs: [changes]
    if: needs.changes.outputs.issue-lifecycle == 'true'
    runs-on: ubuntu-latest
    strategy:
