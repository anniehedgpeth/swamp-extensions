  cve-check:
    name: cve/${{ matrix.cve }} - ${{ matrix.task }}
    needs: [changes]
    if: needs.changes.outputs.cve == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cve: [dirtyfrag, mini-shai-hulud, researcher]
